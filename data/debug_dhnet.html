            window.didomiEventListeners = window.didomiEventListeners || [];
            window.didomiOnReady = window.didomiOnReady || [];
            window.didomiNoticeIsShown = null;

            let mainObserver = null;
            let isProcessing = false;

            const observeDOM = (function () {
              var MutationObserver =
              window.MutationObserver || window.WebKitMutationObserver;

              return function (obj, callback) {
              if (!obj || obj.nodeType !== 1) return;

              if (MutationObserver) {
                var mutationObserver = new MutationObserver(callback);
                mutationObserver.observe(obj, {

                subtree: true,

                obj.addEventListener("DOMNodeInserted", callback, false);
                obj.addEventListener("DOMNodeRemoved", callback, false);
              }
              };
            })();

            const addBtnDidomiDisagree = function () {
              if (isProcessing) return false;

              var btnDidomiContinueWOAgree = document.getElementById(
                "didomi-notice-disagree-button"
              );

              if (!btnDidomiContinueWOAgree) {
                return false;
              }

              if (document.getElementById("didomi-custom-disagree-button")) {
                isProcessing = true;
                btnDidomiContinueWOAgree.remove();
                isProcessing = false;
                return true;
              }

              var customBtnDisagree = document.createElement("button");
              customBtnDisagree.id = "didomi-custom-disagree-button";
              customBtnDisagree.className = "didomi-components-button didomi-button didomi-components-button--color didomi-button-highlight highlight-button";
              customBtnDisagree.role = "button";
              customBtnDisagree.style = "color: #fff; background-color: #e00019";
              customBtnDisagree.innerHTML = "Je refuse et je m'abonne";
              customBtnDisagree.setAttribute('data-custom-button', 'true');

              customBtnDisagree.onclick = function () {
                if (
                  typeof window.localStorage === "object" &&
                  typeof window.localStorage.setItem === "function"
                ) {
                  localStorage.setItem("tmpConsentDenied", "true");
                }
                window.Didomi.setUserDisagreeToAll();
                window.location.href = "https://aboshop.dhnet.be/?promocode=consent";
              };

              isProcessing = true;
              btnDidomiContinueWOAgree.replaceWith(customBtnDisagree);
              isProcessing = false;

              return true;
            };

            const addBtnDidomLogin = function () {
              if (isProcessing) return false;

              if (!document.getElementById("didomi-custom-login-link")) {
                var btnDidomiLogin = document.createElement("span");

                btnDidomiLogin.id = "didomi-custom-login-link";
                btnDidomiLogin.className = "didomi-custom-login";
                btnDidomiLogin.role = "button";
                btnDidomiLogin.innerHTML = "D&eacute;j&agrave; abonn&eacute; ? Se connecter";
                btnDidomiLogin.style = "margin: 0 auto 1rem; color: #e00019 !important;";

                btnDidomiLogin.onclick = function () {
                  if (window.Didomi.shouldConsentBeCollected()) {
                    if (
                      typeof window.localStorage === "object" &&
                      typeof window.localStorage.setItem === "function"
                    ) {
                      localStorage.setItem("tmpConsentDenied", "true");
                    }
                    window.Didomi.setUserDisagreeToAll();
                  }
                  window.location.href = "https://www.dhnet.be/profil/login/" + "?redirect=" + window?.location;
                };

                var buttonsContainer = document.getElementById("buttons");
                if (buttonsContainer) {
                  isProcessing = true;
                  buttonsContainer.after(btnDidomiLogin);
                  isProcessing = false;
                }
              }
            };

            const addBtns = function () {
              if (isProcessing) return false;

              const isLoggedIn = document?.cookie?.includes('__utp');
              const isSubscribed = window?.localStorage?.getItem?.("USER_SUBSCRIBER_dhnet") === "true";

               if (!isLoggedIn) {
                addBtnDidomLogin();
                addBtnDidomiDisagree();
               } else if (!isSubscribed) {
                addBtnDidomiDisagree();
              }
            }

            const processMutations = function (mutations) {
              if (isProcessing) return;

              let needsReplacement = false;

              for (let mutation of mutations) {
                // Vérifier les noeuds ajoutés
                for (let node of mutation.addedNodes) {
                  if (node.nodeType !== 1) continue; // Ignorer les noeuds non-éléments

                  // Si c'est le popup qui est ajouté/réaffiché
                  if (node.id === "didomi-popup") {
                    needsReplacement = true;
                    break;
                  }

                  // Si le bouton original réapparaît directement
                  if (node.id === "didomi-notice-disagree-button") {
                    needsReplacement = true;
                    break;
                  }

                  // Vérifier dans les enfants (pour les cas où le bouton est dans un conteneur ajouté)
                  if (node.querySelector && node.querySelector('#didomi-notice-disagree-button')) {
                    needsReplacement = true;
                    break;
                  }

                  // Supprimer les éléments "continue without agreeing"
                  if (node.classList && node.classList.contains('didomi-continue-without-agreeing')) {
                    isProcessing = true;
                    node.remove();
                    isProcessing = false;
                  }
                }

                // Vérifier si notre bouton custom a été supprimé
                for (let node of mutation.removedNodes) {
                  if (node.nodeType !== 1) continue;

                  if (node.id === "didomi-custom-disagree-button" ||
                    (node.querySelector && node.querySelector('#didomi-custom-disagree-button'))) {
                    needsReplacement = true;
                    break;
                  }
                }

                if (needsReplacement) break;
              }

              if (needsReplacement) {
                addBtns();
              }
            }

            const setupContinuousWatch = function () {
              var divDidomiHost = document.getElementById("didomi-host");

              if (!divDidomiHost) {
                return;
              }

              // Arrêter l'observateur précédent s'il existe
              if (mainObserver) {
                mainObserver.disconnect();
              }

              mainObserver = observeDOM(divDidomiHost, processMutations);
            }

            window.didomiEventListeners.push({
              event: 'notice.shown',
              listener: () => {
                setupContinuousWatch();
                addBtns();
                window.didomiNoticeIsShown = true;
              }
            });

            window.didomiOnReady.push(function (Didomi) {

            const noConsentNoticePages = [
              "/profil/login/",
              "/profil/creation/",
              "/profil/nouveau-mot-de-passe/",
              "/page/vieprivee/",
              "/page/infos-cookies/",
            ];
              
            const tmpConsentDenied = window?.localStorage?.getItem?.("tmpConsentDenied") === "true";

              if (tmpConsentDenied && !window.Didomi.shouldConsentBeCollected() && !noConsentNoticePages.includes(window?.location?.pathname)) {
                Didomi.reset();
                Didomi.notice.show();
                localStorage.removeItem("tmpConsentDenied");
              }
            });

            window.didomiEventListeners.push({
              event: 'notice.hidden',
              listener: () => window.didomiNoticeIsShown = false,
            });
