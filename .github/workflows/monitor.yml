name: "Veille Jeux d'Argent Belgique"

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests beautifulsoup4 lxml playwright

      - name: Installer Chromium
        run: playwright install chromium --with-deps

      - name: Lancer la veille
        run: python scripts/monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Committer les resultats
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html status.md data/last_results.json
          git diff --staged --quiet || git commit -m "Veille du $(TZ='Europe/Brussels' date '+%d/%m/%Y %H:%M')"
          git push
