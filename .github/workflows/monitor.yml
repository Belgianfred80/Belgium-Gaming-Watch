name: "Veille Jeux d'Argent Belgique"

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests beautifulsoup4 lxml playwright

      # Recupere la version exacte de Playwright pour cle de cache
      - name: Version Playwright
        id: pwversion
        run: echo "v=$(pip show playwright | awk '/^Version:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pwversion.outputs.v }}

      # Telechargement uniquement si le cache est vide
      - name: Installer Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: playwright install chromium

      # Les librairies Chromium sont deja presentes sur l'image ubuntu-24.04 :
      # cette etape n'installait que des polices (japonais, chinois, cyrillique,
      # thai) inutiles pour lire du texte, et coutait 14 s a chaque run.
      # On la garde en filet de securite, uniquement quand le cache est vide.
      - name: Dependances systeme Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: playwright install-deps chromium

      - name: Lancer la veille
        run: python scripts/monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Committer les resultats
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html status.md data/
          git diff --staged --quiet || git commit -m "Veille du $(TZ='Europe/Brussels' date '+%d/%m/%Y %H:%M')"
          git push
